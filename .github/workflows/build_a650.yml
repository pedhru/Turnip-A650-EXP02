name: Turnip A650 Mesa 26.2.6 - Build and Validate
on:
  workflow_dispatch:
  push:
    paths:
      - 'build_turnip.sh'
      - 'build_exp18.py'
      - 'pack_driver.py'
      - 'tests/**'
      - '.github/workflows/build_a650.yml'
permissions:
  contents: read
concurrency:
  group: exp19-stable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and unit tests
        run: |
          bash -n build_turnip.sh
          python3 -m compileall -q build_exp18.py pack_driver.py tests
      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex m4 pkg-config unzip curl cmake python3-venv
          python3 -m venv "$RUNNER_TEMP/turnip-venv"
          "$RUNNER_TEMP/turnip-venv/bin/pip" install meson==1.12.1 ninja==1.13.2 mako==1.4.3 pyyaml==6.0.3 packaging==26.3 ply==3.11
          echo "$RUNNER_TEMP/turnip-venv/bin" >> "$GITHUB_PATH"
      - name: Build glslang 15.1.0
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/KhronosGroup/glslang/tar.gz/refs/tags/15.1.0 -o "$RUNNER_TEMP/glslang.tar.gz"
          tar -xzf "$RUNNER_TEMP/glslang.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/glslang-15.1.0" -B "$RUNNER_TEMP/glslang-build" -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DBUILD_TESTING=OFF -DENABLE_GLSLANG_BINARIES=ON
          cmake --build "$RUNNER_TEMP/glslang-build" -j 4
          ln -sf "$RUNNER_TEMP/glslang-build/StandAlone/glslang" "$RUNNER_TEMP/turnip-venv/bin/glslangValidator"
      - name: Compile and validate A650
        env:
          WORK_DIR: ${{ runner.temp }}/turnip-exp19
        run: |
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME
          bash build_turnip.sh
          python3 tests/test_source.py "$WORK_DIR/mesa-26.2.6"
      - name: Upload driver and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turnip_A650_MESA_26_2_6_${{ github.run_number }}
          path: |
            ${{ runner.temp }}/turnip-exp19/Turnip_A650_EXP19_MESA_26_2_6.zip
            ${{ runner.temp }}/turnip-exp19/out/meson-logs/meson-log.txt
          if-no-files-found: warn
